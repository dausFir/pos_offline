<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Prevent aggressive caching in Chrome -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#00458f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasir UMKM" />
    <meta name="description" content="Sistem kasir offline-first untuk UMKM" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Kasir UMKM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Debug console test - FIRST THING
      console.log('🔥🔥🔥 [BROWSER] HTML loaded - JavaScript working! 🔥🔥🔥');
      console.log('🔥🔥🔥 [BROWSER] Location:', window.location.href);
      console.log('🔥🔥🔥 [BROWSER] localStorage available:', !!window.localStorage);
      
      // Test localStorage immediately
      try {
        localStorage.setItem('browser_test', 'working');
        console.log('✅ [BROWSER] localStorage test successful');
        localStorage.removeItem('browser_test');
      } catch (err) {
        console.error('❌ [BROWSER] localStorage error:', err);
        alert('localStorage BROKEN: ' + err.message);
      }
      
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          console.log('🔥🔥🔥 [BROWSER] Window fully loaded! SW registering... 🔥🔥🔥');
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW failed:', err));
        });
      }
    </script>
  </body>
</html>
