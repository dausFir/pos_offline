<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Test - Kasir UMKM</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #fff; padding: 20px; }
    .log { margin: 5px 0; padding: 10px; border-radius: 5px; }
    .success { background: #1a7a3c; }
    .error { background: #ba1a1a; }
    .info { background: #00458f; }
    button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-primary { background: #00458f; color: white; }
    .btn-success { background: #1a7a3c; color: white; }
    .btn-danger { background: #ba1a1a; color: white; }
  </style>
</head>
<body>
  <h1>🔧 Debug Test Page - Kasir UMKM</h1>
  <p>Halaman ini untuk debug tanpa React interference</p>
  
  <div id="logs"></div>
  
  <div style="margin-top: 20px;">
    <button class="btn-primary" onclick="testLocalStorage()">Test localStorage</button>
    <button class="btn-primary" onclick="testManualLogin()">Test Manual Login</button>
    <button class="btn-success" onclick="setTestTokens()">Set Test Tokens</button>
    <button class="btn-danger" onclick="clearAll()">Clear All</button>
  </div>
  
  <script>
    function log(message, type = 'info') {
      console.log(message);
      const logDiv = document.getElementById('logs');
      const logElement = document.createElement('div');
      logElement.className = `log ${type}`;
      logElement.textContent = new Date().toLocaleTimeString() + ' - ' + message;
      logDiv.appendChild(logElement);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Initial console test
    console.log('🔥🔥🔥 [DEBUG PAGE] Static HTML page loaded! 🔥🔥🔥');
    log('🔥 DEBUG PAGE LOADED - Console working!', 'success');

    function testLocalStorage() {
      log('Testing localStorage...', 'info');
      
      try {
        // Test basic operations
        localStorage.setItem('test_key', 'test_value');
        const retrieved = localStorage.getItem('test_key');
        
        if (retrieved === 'test_value') {
          log('✅ localStorage basic test: SUCCESS', 'success');
        } else {
          log('❌ localStorage basic test: FAILED - wrong value', 'error');
          return;
        }
        
        // Test JSON storage
        const testObj = { name: 'admin', role: 'super_admin' };
        localStorage.setItem('test_json', JSON.stringify(testObj));
        const retrievedObj = JSON.parse(localStorage.getItem('test_json'));
        
        if (retrievedObj.name === 'admin') {
          log('✅ localStorage JSON test: SUCCESS', 'success');
        } else {
          log('❌ localStorage JSON test: FAILED', 'error');
        }
        
        // Test token-like data
        const fakeToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test.token';
        localStorage.setItem('test_token', fakeToken);
        const retrievedToken = localStorage.getItem('test_token');
        
        if (retrievedToken === fakeToken) {
          log('✅ localStorage token test: SUCCESS', 'success');
        } else {
          log('❌ localStorage token test: FAILED', 'error');
        }
        
        // Cleanup test data
        localStorage.removeItem('test_key');
        localStorage.removeItem('test_json');
        localStorage.removeItem('test_token');
        
        log('🧹 Test data cleaned up', 'info');
        
      } catch (error) {
        log('❌ localStorage ERROR: ' + error.message, 'error');
      }
    }

    function testManualLogin() {
      log('Testing manual login API call...', 'info');
      
      fetch('http://localhost:8080/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username: 'admin',
          password: 'admin123'
        })
      })
      .then(response => {
        log('📋 Response status: ' + response.status, 'info');
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        return response.json();
      })
      .then(data => {
        log('📋 API Response received', 'info');
        console.log('Full API response:', data);
        
        if (data.success && data.data) {
          log('✅ API Login SUCCESS!', 'success');
          log('🎟️ Access token: ' + data.data.access_token.substring(0, 30) + '...', 'info');
          log('🔄 Refresh token: ' + data.data.refresh_token.substring(0, 30) + '...', 'info');
          log('👤 User: ' + data.data.user.username + ' (' + data.data.user.role + ')', 'info');
          
          // Store tokens
          try {
            localStorage.setItem('access_token', data.data.access_token);
            localStorage.setItem('refresh_token', data.data.refresh_token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            log('💾 Tokens saved to localStorage', 'success');
          } catch (storageError) {
            log('❌ Failed to save tokens: ' + storageError.message, 'error');
          }
          
        } else {
          log('❌ API Login FAILED: ' + (data.error || 'Unknown error'), 'error');
        }
      })
      .catch(error => {
        log('❌ Network ERROR: ' + error.message, 'error');
      });
    }

    function setTestTokens() {
      log('Setting test tokens...', 'info');
      
      const testTokens = {
        access_token: 'test_access_token_123',
        refresh_token: 'test_refresh_token_456',
        user: { username: 'admin', role: 'super_admin', id: 1 }
      };
      
      try {
        localStorage.setItem('access_token', testTokens.access_token);
        localStorage.setItem('refresh_token', testTokens.refresh_token);
        localStorage.setItem('user', JSON.stringify(testTokens.user));
        log('✅ Test tokens set successfully', 'success');
        
        // Verify
        log('🔍 Verification:', 'info');
        log('  access_token: ' + (localStorage.getItem('access_token') || 'MISSING'), 'info');
        log('  refresh_token: ' + (localStorage.getItem('refresh_token') || 'MISSING'), 'info');
        log('  user: ' + (localStorage.getItem('user') || 'MISSING'), 'info');
        
      } catch (error) {
        log('❌ Failed to set test tokens: ' + error.message, 'error');
      }
    }

    function clearAll() {
      log('Clearing all storage...', 'info');
      try {
        localStorage.clear();
        sessionStorage.clear();
        log('✅ All storage cleared', 'success');
      } catch (error) {
        log('❌ Clear failed: ' + error.message, 'error');
      }
    }

    // Run initial tests
    window.addEventListener('load', function() {
      log('🚀 Window loaded - running initial tests...', 'info');
      testLocalStorage();
    });
  </script>
</body>
</html>
