<!DOCTYPE html>
<html>
<head>
    <title>Test Trial UI</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test-box { border: 1px solid #ddd; padding: 15px; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>🧪 Test Trial API Data</h2>
    
    <div class="test-box">
        <h3>1. Test Trial Stats API</h3>
        <button onclick="testTrialStats()">Test /api/trial/stats</button>
        <pre id="trialStatsResult"></pre>
    </div>

    <div class="test-box">
        <h3>2. Test Settings API (dengan auth)</h3>
        <input type="text" id="authToken" placeholder="Masukkan bearer token" style="width: 400px">
        <button onclick="testSettingsAPI()">Test /api/settings</button>
        <pre id="settingsResult"></pre>
    </div>

    <div class="test-box">
        <h3>3. Simulasi UI Display</h3>
        <button onclick="simulateUI()">Simulate Days Used Display</button>
        <div id="uiSimulation"></div>
    </div>

    <script>
        async function testTrialStats() {
            try {
                const response = await fetch('/api/trial/stats');
                const data = await response.json();
                document.getElementById('trialStatsResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('trialStatsResult').textContent = 'Error: ' + error.message;
            }
        }

        async function testSettingsAPI() {
            const token = document.getElementById('authToken').value;
            if (!token) {
                alert('Masukkan token dulu');
                return;
            }
            
            try {
                const response = await fetch('/api/settings', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                const data = await response.json();
                document.getElementById('settingsResult').textContent = JSON.stringify(data, null, 2);
                
                // Extract trial data for UI simulation
                if (data.success && data.data.trial_usage_stats) {
                    showTrialBannerDemo(data.data);
                }
            } catch (error) {
                document.getElementById('settingsResult').textContent = 'Error: ' + error.message;
            }
        }

        function showTrialBannerDemo(trialData) {
            const stats = trialData.trial_usage_stats;
            const daysLeft = trialData.trial_days_left || 0;
            const maxProducts = trialData.max_products || 20;
            
            const html = `
                <div style="background: #e8f5e8; border: 1px solid #4caf50; border-left: 4px solid #4caf50; border-radius: 8px; padding: 16px; margin: 10px 0; color: #2e7d32;">
                    <div style="font-weight: 700; margin-bottom: 4px;">
                        ⏰ Trial - ${daysLeft} hari tersisa
                    </div>
                    <div style="font-size: 13px; opacity: 0.85;">
                        Batas: ${maxProducts} produk | Sudah digunakan ${stats.days_used || 0} hari dari 7 hari
                    </div>
                    <div style="background: rgba(255,255,255,0.3); border-radius: 6px; padding: 12px; margin-top: 12px;">
                        <div style="font-weight: 600; margin-bottom: 8px;">📈 Penggunaan Trial Anda:</div>
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; font-size: 12px;">
                            <div>
                                <div style="opacity: 0.8;">Produk Dibuat</div>
                                <div style="font-weight: 700; font-size: 14px;">${stats.products_created} / ${maxProducts}</div>
                            </div>
                            <div>
                                <div style="opacity: 0.8;">Transaksi</div>
                                <div style="font-weight: 700; font-size: 14px;">${stats.transactions_count}</div>
                            </div>
                            <div>
                                <div style="opacity: 0.8;">Total Omset</div>
                                <div style="font-weight: 700; font-size: 14px;">Rp ${stats.total_revenue.toLocaleString()}</div>
                            </div>
                            <div>
                                <div style="opacity: 0.8;">Hari Digunakan</div>
                                <div style="font-weight: 700; font-size: 14px;">${stats.days_used || 0} hari</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('uiSimulation').innerHTML = html;
        }

        function simulateUI() {
            // Sample data
            const sampleTrialData = {
                trial_days_left: 7,
                max_products: 20,
                trial_usage_stats: {
                    products_created: 3,
                    transactions_count: 1,
                    total_revenue: 5000,
                    days_used: 0
                }
            };
            showTrialBannerDemo(sampleTrialData);
        }

        // Auto test on load
        window.onload = function() {
            testTrialStats();
        }
    </script>
</body>
</html>
